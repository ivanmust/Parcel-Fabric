openapi: 3.1.0
info:
  title: Rwanda Parcel Fabric API
  version: 0.1.0
  summary: Backend for the Rwanda Parcel Fabric web editing application.
  description: |
    The web application reads and edits the Parcel Fabric directly on ArcGIS Enterprise with the
    signed-in user's own Portal token; ArcGIS authorises every read and edit. This API does not
    proxy GIS data. It provides:

    - **Configuration** the browser needs (service URLs, Portal address). No secrets.
    - **Sessions:** resolves a Portal token into the application role and permissions.
    - **Audit events** reported by the application, and reading them back (administrators).
    - **Per-user bookmarks.**
    - **Health** and client error reporting.

    **Authentication.** Endpoints marked with a lock need `Authorization: Bearer <Portal token>`.
    The API validates the token against Portal (`/sharing/rest/community/self`) and caches the result
    for 5 minutes. Portal tokens are often bound to the web app's origin: call from the app's origin,
    or send it in `X-Client-Origin` (it must be one of the configured `APP_ORIGINS`).

    **Limits.** 600 requests per minute per client IP on `/api` (standard `RateLimit` headers), JSON
    bodies up to 256 KB. Every response carries an `X-Request-Id`; errors repeat it as `requestId`.

    **Application roles** (from Portal role, privileges and groups) gate the application only; they
    never grant ArcGIS permissions.
  license:
    name: Proprietary
servers:
  # Relative to this file (served at <base>/api/openapi.yaml), so "Try it out" keeps any reverse-proxy
  # prefix: /api/... locally, /fabric/api/... behind https://esrirw.rw/fabric/.
  - url: .
    description: This server
tags:
  - name: System
    description: Health and configuration
  - name: Session
    description: Sign-in bookkeeping and the application session
  - name: Audit
    description: Audit trail of application actions
  - name: Bookmarks
    description: Saved map views per user
  - name: LAIS
    description: LAIS transaction intake (server-to-server, X-API-Key)
  - name: Webhooks
    description: Subdivision completion webhook to App B (administrators); contract in docs/SUBDIVISION-WEBHOOK.md
  - name: LAIS editing
    description: GIS editors send a LAIS transaction's finished work to LAIS for the registrar's approval (switch LAIS_EDITING_DONE)
  - name: Diagnostics
    description: Browser error reporting

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and ArcGIS Enterprise reachability
      description: Checks the public ArcGIS Server `rest/info` endpoint. The check is cached for 15 seconds. No authentication.
      security: []
      responses:
        "200":
          description: The API is running. `arcgis.reachable` says whether ArcGIS Enterprise answered.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example:
                status: ok
                time: "2026-11-22T14:05:12.345Z"
                arcgis: { reachable: true, version: "12.1.0", latencyMs: 112 }

  /config:
    get:
      tags: [System]
      operationId: getConfig
      summary: Runtime configuration for the web client
      description: Public, non-secret settings. The browser loads this before sign-in.
      security: []
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeConfig" }
              example:
                portalUrl: https://esrirw.rw/portal
                serverUrl: https://esrirw.rw/server
                oauthAppId: null
                services:
                  mapServer: https://esrirw.rw/server/rest/services/ParcelFabric/MapServer
                  featureServer: https://esrirw.rw/server/rest/services/ParcelFabric/FeatureServer
                  parcelFabricServer: https://esrirw.rw/server/rest/services/ParcelFabric/ParcelFabricServer
                  versionManagementServer: https://esrirw.rw/server/rest/services/ParcelFabric/VersionManagementServer
                  validationServer: https://esrirw.rw/server/rest/services/ParcelFabric/ValidationServer
                project: { name: Kigali Parcel Fabric, dataset: kigaliParcels }

  /auth/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: The signed-in user, application role and permissions
      responses:
        "200":
          description: The session resolved from the Portal token
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/SessionUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/PortalUnavailable" }

  /auth/signed-in:
    post:
      tags: [Session]
      operationId: recordSignIn
      summary: Record a sign-in in the audit log
      description: Called once by the web app after sign-in. Writes an `auth.sign-in` audit event.
      responses:
        "204": { description: Recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/PortalUnavailable" }

  /auth/signed-out:
    post:
      tags: [Session]
      operationId: recordSignOut
      summary: Forget a token on sign-out
      description: Removes the token from the API's validation cache. A token is optional; without one this does nothing. Always 204.
      security:
        - {}
        - bearerAuth: []
      responses:
        "204": { description: Done }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /audit:
    post:
      tags: [Audit]
      operationId: writeAuditEvent
      summary: Record an application action
      description: |
        The web app reports GIS operations here (edits, version actions, validation runs). The user,
        role, IP and request ID are added by the server. Keys in `details` that look like credentials
        (`token`, `password`, `secret`, `authorization`, `cookie`, `credential`) are dropped, tokens in
        URLs are redacted, and `details` is limited to 8 KB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditEventInput" }
            example:
              action: version.reconcile
              outcome: success
              target: gisa@esri_rw.Editor
              details: { hasConflicts: false, didPost: false }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/PortalUnavailable" }
    get:
      tags: [Audit]
      operationId: readAuditEvents
      summary: Read recent audit events (newest first)
      description: |
        Requires the `admin:audit` permission (application role Administrator). Used by the web app's
        Activity audit page. Filters combine; for the next page pass the last event's `id` as `before`.
      parameters:
        - name: username
          in: query
          description: Only events whose username contains this text (any case)
          schema: { type: string, maxLength: 200 }
        - name: action
          in: query
          description: Only actions starting with this text, e.g. `version.` or `parcel-fabric.`
          schema: { type: string, maxLength: 120 }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure, attempt] }
        - name: from
          in: query
          description: Events at or after this time (ISO 8601 with timezone)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Events before this time (ISO 8601 with timezone)
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: Text anywhere in the action, username, target or details (any case)
          schema: { type: string, maxLength: 200 }
        - name: before
          in: query
          description: Paging. The id of the last event already shown; the page starts after it.
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events, hasMore]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  hasMore: { type: boolean, description: "More events match: ask again with before = the last event's id" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/PortalUnavailable" }

  /lais/transactions:
    post:
      tags: [LAIS]
      operationId: submitLaisTransaction
      summary: Submit a LAIS transaction
      description: |
        Server-to-server endpoint for LAIS. Synchronous: the result is final when the response arrives.

        The API validates the request, finds exactly one Plot whose UPI (`name`) matches in sde.DEFAULT,
        creates a **public** named version `{TYPE}-{CASE_NUMBER}-{DATE}` (e.g. `SUBV-CASE123-20261125`) and records the transaction on
        that Plot **inside the version** (`case_ = Yes`, `version_status = VersionCreated`). sde.DEFAULT is
        never edited; GIS editors review, reconcile and post the version.

        Only a **201** means a new transaction was recorded. Every refusal has `success: false`, `case: "No"`:
        - **409 ALREADY_RECORDED**: this Transaction_ID was recorded before; nothing new was created. `data` holds
          the transaction as it stands (stage InReview, Posted or Closed). A retry after a lost response gets this.
        - **409 UPI_IN_TRANSACTION**: one open transaction per UPI. The parcel is in another transaction whose GIS
          version is not posted or removed yet; `errors[].transactionId` names it. Resubmit once that one is
          Posted or Closed.
        - **409 DUPLICATE_TRANSACTION_ID**: the same Transaction_ID with a different payload.
        After a 5xx, resubmit the same payload.
      security:
        - laisApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LaisTransactionRequest" }
            example: { UPI: "1/02/13/02/1001", Transaction_ID: "LAIS-SUB-2026-00125", Transaction_Type: "Subdivision", Transaction_Date: "2026-11-24T08:30:00+02:00" }
      responses:
        "201":
          description: Validated and recorded in a new public version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaisSuccess" }
        "400": { $ref: "#/components/responses/LaisFailure" }
        "401": { $ref: "#/components/responses/LaisFailure" }
        "409":
          description: Not recorded again (ALREADY_RECORDED, with the existing transaction in `data`), the UPI is in another open transaction (UPI_IN_TRANSACTION), or the Transaction_ID was used with a different payload (DUPLICATE_TRANSACTION_ID)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/responses/LaisFailure/content/application~1json/schema"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LaisTransaction", description: "ALREADY_RECORDED only: the transaction as it stands" }
              examples:
                alreadyRecorded:
                  summary: Same Transaction_ID sent again
                  value: { success: false, case: "No", message: "This transaction was already recorded.", errors: [{ field: "Transaction_ID", code: "ALREADY_RECORDED", message: "This Transaction_ID was already recorded (stage InReview); nothing new was created. Its current state is in data, or GET /transactions/{Transaction_ID}." }], data: { UPI: "1/02/13/02/1001", UPIs: ["1/02/13/02/1001"], Transaction_ID: "LAIS-SUB-2026-00125", Transaction_Type: "Subdivision", stage: "InReview", version_name: "qt_testing.SUBV-LAIS-SUB-2026-00125-20261124" }, requestId: "3f1c2a7e-0d5b-4139-9de0-c86997056829" }
                upiInTransaction:
                  summary: Another Transaction_ID on a UPI that GIS has not finished
                  value: { success: false, case: "No", message: "A parcel is already in another transaction that GIS has not finished.", errors: [{ field: "UPI", code: "UPI_IN_TRANSACTION", transactionId: "LAIS-SUB-2026-00125", message: "UPI 1/02/13/02/1001 is already in transaction LAIS-SUB-2026-00125 (Subdivision, GIS version qt_testing.SUBV-LAIS-SUB-2026-00125-20261124), which GIS has not finished. Submit a new transaction for this parcel once that one is Posted or Closed." }], requestId: "3f1c2a7e-0d5b-4139-9de0-c86997056829" }
        "413": { $ref: "#/components/responses/LaisFailure" }
        "422": { $ref: "#/components/responses/LaisFailure" }
        "429": { $ref: "#/components/responses/LaisFailure" }
        "500": { $ref: "#/components/responses/LaisFailure" }
        "502": { $ref: "#/components/responses/LaisFailure" }
        "503": { $ref: "#/components/responses/LaisFailure" }

    get:
      tags: [LAIS]
      operationId: listLaisTransactions
      summary: All LAIS transactions, for the LAIS dashboard
      description: |
        Every transaction this API accepted, oldest change first, each in the same shape as
        `GET /lais/transactions/{transactionId}`. Transactions that can still change (`InReview`, `Closed`,
        or `Posted` with warnings) are checked against GIS first; settled ones come from the API's records.

        **Polling.** Call once without `updatedSince`, then each time with `updatedSince` set to the previous
        response's `next_updated_since`: you get only transactions whose `stage`, `result` or `warnings`
        changed. A transaction may come twice; never zero times. When `has_more` is true, call again at once
        with the new `next_updated_since` for the rest.
      security:
        - laisApiKey: []
      parameters:
        - name: updatedSince
          in: query
          description: ISO 8601 with a timezone. Only transactions whose reported state changed at or after this time.
          schema: { type: string, format: date-time }
          example: "2026-11-26T08:00:00Z"
        - name: stage
          in: query
          schema: { type: string, enum: [InReview, Posted, Closed] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  case: { type: string, const: "Yes" }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      transactions: { type: array, items: { $ref: "#/components/schemas/LaisTransaction" } }
                      has_more: { type: boolean }
                      next_updated_since: { type: string, format: date-time, description: "Pass as updatedSince on the next call" }
        "400": { $ref: "#/components/responses/LaisFailure" }
        "401": { $ref: "#/components/responses/LaisFailure" }
        "429": { $ref: "#/components/responses/LaisFailure" }
        "502": { $ref: "#/components/responses/LaisFailure" }
        "503": { $ref: "#/components/responses/LaisFailure" }

  /lais/transactions/{transactionId}:
    get:
      tags: [LAIS]
      operationId: getLaisTransaction
      summary: Status of a submitted LAIS transaction, and its resulting parcels once posted
      description: |
        `stage`:
        - `InReview`: GIS has not finished it. The change is not in sde.DEFAULT yet.
        - `Posted`: GIS edited the parcels and posted the version, so the change is in sde.DEFAULT. `result` lists
          the resulting parcels (new UPIs, area, location), the retired parcels (expired UPIs) and the Parcel
          Fabric record. Their attributes are read from GIS on every call, so a UPI that GIS assigns later appears.
        - `Closed`: the version was removed without the change reaching sde.DEFAULT (cancelled in GIS).

        `warnings` while `Posted`: `UPI_MISSING` (a resulting parcel has no UPI yet), `NO_RESULT_PARCELS`.
      security:
        - laisApiKey: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Transaction found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaisSuccess" }
        "400": { $ref: "#/components/responses/LaisFailure" }
        "401": { $ref: "#/components/responses/LaisFailure" }
        "404": { $ref: "#/components/responses/LaisFailure" }
        "409": { $ref: "#/components/responses/LaisFailure" }
        "429": { $ref: "#/components/responses/LaisFailure" }
        "502": { $ref: "#/components/responses/LaisFailure" }
        "503": { $ref: "#/components/responses/LaisFailure" }

  /lais/transactions/{transactionId}/approve:
    post:
      tags: [LAIS]
      operationId: approveLaisTransaction
      summary: The registrar approved the work GIS sent; GIS assigns the new UPIs and posts it
      description: |
        Approves one editing-done notification (`event_id`). GIS gives every new parcel its UPI in the transaction's
        version (the next numbers of the parents' cell; retired UPIs are never reused), then reconciles and posts the
        version to sde.DEFAULT. `data` is the transaction as `GET /transactions/{id}` reports it (stage `Posted`, result
        parcels) plus `approval.upis`: the UPI of each new parcel by `parcel_ref` (from the notification).

        Only when the approval flow is switched on in GIS (`FLOW_NOT_ENABLED` otherwise).

        Safe to repeat after a failure: a retry reuses the same UPIs. Once approved, a repeat is `409 ALREADY_APPROVED`
        with the UPIs in `data`. Errors (409): `NOT_SUBMITTED`, `EVENT_MISMATCH` (decide on `data.latest_event_id`),
        `ALREADY_REJECTED`, `CHANGED_SINCE_SUBMISSION` (the editor changed the work; a new notification follows),
        `NOT_READY`, `VERSION_GONE`, `ALREADY_POSTED`, `RECONCILE_CONFLICT` (the editor must resolve it and send again),
        `VERSION_IN_USE` (retry later), `CELL_REQUIRED` (the parents are in several cells: send `cell`). Nothing is
        posted on any of them. `503 GIS_NOT_CONFIGURED`: the GIS account cannot edit (licence).
      security:
        - laisApiKey: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, approved_by]
              properties:
                event_id: { type: string, format: uuid, description: "The editing-done notification being approved." }
                approved_by: { type: string, maxLength: 100, example: "registrar.one" }
                cell: { type: string, pattern: '^\d/\d{2}/\d{2}/\d{2}$', example: "1/02/13/02", description: "Only when GIS asks for it (CELL_REQUIRED)." }
      responses:
        "200":
          description: Approved and posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaisSuccess" }
              example:
                success: true
                case: "Yes"
                message: "Approved: GIS posted the change with 2 parcel(s)."
                data:
                  Transaction_ID: LAIS-SUB-2026-00125
                  stage: Posted
                  approval:
                    event_id: 7d1f0c2e-5b7a-4c1e-9a55-2f3d8e6b1c90
                    status: approved
                    approved_by: registrar.one
                    approved_at: "2026-11-27T10:02:11.000Z"
                    cell: 1/02/13/02
                    upis:
                      - { parcel_ref: "{B48C7050-494C-4538-B8E7-569376E8D956}", UPI: 1/02/13/02/9010 }
                      - { parcel_ref: "{98E9F2FA-E697-4F0B-8973-2B4DA555E63F}", UPI: 1/02/13/02/9011 }
        "401": { $ref: "#/components/responses/LaisFailure" }
        "404": { $ref: "#/components/responses/LaisFailure" }
        "409": { $ref: "#/components/responses/LaisFailure" }
        "422": { $ref: "#/components/responses/LaisFailure" }
        "429": { $ref: "#/components/responses/LaisFailure" }
        "502": { $ref: "#/components/responses/LaisFailure" }
        "503": { $ref: "#/components/responses/LaisFailure" }

  /lais/transactions/{transactionId}/reject:
    post:
      tags: [LAIS]
      operationId: rejectLaisTransaction
      summary: The registrar rejected the work GIS sent; the editor revises it and sends it again
      description: |
        Records the rejection of one editing-done notification with the reason, shown to the GIS editor. Nothing in GIS
        changes. The editor revises the work in the same version and sends a new notification (new `event_id`).
        Errors (409): `NOT_SUBMITTED`, `EVENT_MISMATCH`, `ALREADY_REJECTED`, `ALREADY_APPROVED`, `APPROVAL_IN_PROGRESS`.
      security:
        - laisApiKey: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, rejected_by, reason]
              properties:
                event_id: { type: string, format: uuid }
                rejected_by: { type: string, maxLength: 100, example: "registrar.one" }
                reason: { type: string, maxLength: 1000, example: "The new boundary does not follow the survey plan." }
      responses:
        "200":
          description: Rejection recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LaisSuccess" }
        "401": { $ref: "#/components/responses/LaisFailure" }
        "404": { $ref: "#/components/responses/LaisFailure" }
        "409": { $ref: "#/components/responses/LaisFailure" }
        "422": { $ref: "#/components/responses/LaisFailure" }
        "429": { $ref: "#/components/responses/LaisFailure" }

  /client-log:
    post:
      tags: [Diagnostics]
      operationId: reportClientError
      summary: Report a browser error to the server log
      description: The web app sends uncaught errors here (at most 10 a minute per browser, tokens scrubbed). An invalid body is ignored; the response is always 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, message]
              properties:
                level: { type: string, enum: [error, warn] }
                message: { type: string, maxLength: 2000 }
                context: { type: string, maxLength: 4000, description: "Stack trace or other context" }
      responses:
        "204": { description: Accepted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /bookmarks:
    get:
      tags: [Bookmarks]
      operationId: getBookmarks
      summary: The signed-in user's bookmarks
      description: Returns an empty list when the user has none.
      responses:
        "200":
          description: Bookmarks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookmarkList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/PortalUnavailable" }
    put:
      tags: [Bookmarks]
      operationId: saveBookmarks
      summary: Replace the signed-in user's bookmarks
      description: Replaces the whole list (at most 200). Thumbnails are removed before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkList" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/PortalUnavailable" }

  /lais-editing/transactions:
    get:
      tags: [LAIS editing]
      operationId: listLaisTransactionsForEditors
      summary: LAIS transactions with a version, and where each one's "editing done" notification stands
      description: Signed-in users with features:edit. Reads the server ledger only.
      responses:
        "200":
          description: The switch, whether the LAIS endpoint is configured, and the transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  configured: { type: boolean }
                  transactions: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /lais-editing/transactions/{transactionId}/preview:
    get:
      tags: [LAIS editing]
      operationId: previewEditingDone
      summary: What would be sent to LAIS, with problems to fix first (sends nothing)
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string } }
        - { name: recordName, in: query, required: false, description: "The record to use when it is not named after the version (the editor's active record)", schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: "payload (null when not ready), problems (must be fixed), warnings"
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload: { type: [object, "null"] }
                  problems: { type: array, items: { type: string } }
                  warnings: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /lais-editing/transactions/{transactionId}/editing-done:
    post:
      tags: [LAIS editing]
      operationId: sendEditingDone
      summary: The editor has finished; send the work to LAIS
      description: |
        Builds the notification from the transaction's version and posts it to LAIS_WEBHOOK_URL with
        X-API-Key. 200 when LAIS answered 2xx; 202 when it is retrying (408/429/5xx/timeout) or LAIS
        refused it (other 4xx: see last_message). 409 already_sent, version_gone or already_posted;
        422 not_ready (error.details.problems); 503 feature_disabled or not_configured.
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                recordName: { type: string, maxLength: 255 }
      responses:
        "200": { description: Delivered to LAIS }
        "202": { description: Not delivered yet (retrying) or refused by LAIS }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /webhooks/subdivision/events:
    get:
      tags: [Webhooks]
      operationId: listSubdivisionWebhookEvents
      summary: Subdivision completion events in the outbox (newest first)
      description: Requires admin:audit. Shows payloads, delivery state and attempt history; never signing keys.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, delivering, delivered, dead] } }
      responses:
        "200": { description: "enabled, events" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /webhooks/subdivision/waiting:
    get:
      tags: [Webhooks]
      operationId: listSubdivisionWebhookWaiting
      summary: Posted subdivisions whose event waits for complete data (e.g. a missing UPI)
      responses:
        "200": { description: "waiting: key, since, lastCheckedAt, checks, reason" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /webhooks/subdivision/events/{eventId}/replay:
    post:
      tags: [Webhooks]
      operationId: replaySubdivisionWebhookEvent
      summary: Queue a dead-lettered event again (after fixing the cause)
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The event, pending again }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: The event is not dead-lettered }

security:
  - bearerAuth: []

components:
  securitySchemes:
    laisApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Dedicated server-to-server LAIS credential, separate from ArcGIS Portal authentication.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ArcGIS Portal token
      description: An ArcGIS Enterprise Portal token for the signed-in user. Never shared with other services; never logged.

  headers:
    RequestId:
      description: Request ID; echoed from a valid incoming `X-Request-Id` (letters, digits, `.`, `_`, `-`, up to 64) or generated.
      schema: { type: string }

  responses:
    LaisFailure:
      description: "Not recorded. errors[].code says why: REQUIRED_FIELD, INVALID_TYPE, TOO_LONG, TOO_LONG_FOR_GIS (attributes mode only), UNKNOWN_FIELD, INVALID_UPI_FORMAT, INVALID_FORMAT, INVALID_TRANSACTION_TYPE, INVALID_TRANSACTION_STATUS, INVALID_DATE, PARCEL_NOT_FOUND, UPI_EXPIRED (replacedBy lists the current UPIs), UPI_NOT_UNIQUE, NOT_NEIGHBOURS, MERGE_NEEDS_TWO_UPIS, SUBDIVISION_NEEDS_ONE_UPI, CONFLICTING_FIELDS, DUPLICATE_UPI, DUPLICATE_TRANSACTION_ID, ALREADY_RECORDED (data holds the existing transaction), UPI_IN_TRANSACTION (transactionId names the open transaction), NOT_FOUND, INVALID_TRANSACTION_ID, UNAUTHORIZED, INVALID_JSON, PAYLOAD_TOO_LARGE, RATE_LIMITED, GIS_UNAVAILABLE, GIS_NOT_CONFIGURED, INTERNAL_ERROR."
      content:
        application/json:
          schema:
            type: object
            required: [success, case, message, errors]
            properties:
              success: { type: boolean, const: false }
              case: { type: string, const: "No" }
              message: { type: string }
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string, description: "UPI, UPIs, UPIs[i] (the i-th parcel), Transaction_ID, … or request" }
                    code: { type: string }
                    message: { type: string }
                    replacedBy: { type: array, items: { type: string }, description: "UPI_EXPIRED only: the current UPIs of the parcels that replaced the expired one" }
                    transactionId: { type: string, description: "UPI_IN_TRANSACTION only: the open transaction that holds the parcel" }
              requestId: { type: string }
          example: { success: false, case: "No", message: "Validation failed", errors: [{ field: "UPI", code: "PARCEL_NOT_FOUND", message: "No parcel with this UPI exists in GIS." }], requestId: "3f1c2a7e-0d5b-4139-9de0-c86997056829" }
    BadRequest:
      description: The request body or query is invalid (`invalid_json`, `invalid_audit_event`, `invalid_query`, `invalid_bookmarks`). `details` lists the problems.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: invalid_bookmarks, message: Invalid bookmarks payload, details: [{ path: [bookmarks], message: "Too big: expected array to have <=200 items" }], requestId: 3f2b7c1e-0f7a-4c55-9a5f-2a1d9e8b7c6d }
    Unauthorized:
      description: No token (`auth_required`), or Portal rejected it (`invalid_token`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: invalid_token, message: Your ArcGIS session is invalid or has expired. Please sign in again., requestId: 3f2b7c1e-0f7a-4c55-9a5f-2a1d9e8b7c6d }
    Forbidden:
      description: The application role lacks a required permission (`forbidden`). `details.needed` names it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: { code: forbidden, message: You do not have permission to perform this action, details: { needed: ["admin:audit"] }, requestId: 3f2b7c1e-0f7a-4c55-9a5f-2a1d9e8b7c6d }
    TooManyRequests:
      description: More than 600 requests in a minute from this client.
      headers:
        RateLimit:
          description: Remaining quota (IETF draft-8 format)
          schema: { type: string }
        RateLimit-Policy:
          schema: { type: string }
    PortalUnavailable:
      description: Portal could not be reached to validate the token (`portal_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    LaisTransactionRequest:
      type: object
      additionalProperties: false
      required: [Transaction_ID, Transaction_Type, Transaction_Date]
      description: "Parcels: send UPI (one) or UPIs (a list), not both. Merge: 2 or more neighbouring parcels in UPIs; Subdivision: exactly 1; CorrectBoundaries: 1 or more; CreatePlot: 0 or more. Every UPI must be a current parcel."
      properties:
        UPI: { type: string, maxLength: 100, pattern: '^\d/\d{2}/\d{2}/\d{2}/\d+$', example: "1/02/13/02/1001" }
        UPIs: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, maxLength: 100, pattern: '^\d/\d{2}/\d{2}/\d{2}/\d+$' }, example: ["1/02/13/02/2679", "1/02/13/02/2682"] }
        Transaction_ID: { type: string, minLength: 1, description: "No maximum length; it is the CASE_NUMBER in the version name {TYPE}-{CASE_NUMBER}-{DATE}", pattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]*$', example: "LAIS-SUB-2026-00125" }
        Transaction_Type: { type: string, enum: [Subdivision, Merge, CorrectBoundaries, CreatePlot] }
        Transaction_Date: { type: string, format: date-time, description: "ISO 8601 with an explicit timezone", example: "2026-11-24T08:30:00+02:00" }
        Transaction_Status: { type: string, enum: [New, InProgress, Approved, Rejected], description: "Optional. Written to the Plot only when sent." }
    LaisSuccess:
      type: object
      properties:
        success: { type: boolean, const: true }
        case: { type: string, const: "Yes" }
        message: { type: string }
        data: { $ref: "#/components/schemas/LaisTransaction" }
    LaisTransaction:
      type: object
      properties:
        UPI: { type: [string, "null"], description: "The first parcel LAIS sent (kept for single-parcel clients)" }
        UPIs: { type: array, items: { type: string }, description: "The parcels LAIS sent" }
        Transaction_ID: { type: string }
        Transaction_Type: { type: string }
        Transaction_Status: { type: [string, "null"] }
        Transaction_Date: { type: string, format: date-time, description: "Normalised to UTC" }
        case: { type: string, const: "Yes" }
        validation_message: { type: string }
        version_name: { type: string, example: "svc_lais.SUBV-LAIS-SUB-2026-00125-20261124" }
        version_status: { type: string, enum: [Pending, VersionCreated] }
        stage: { type: string, enum: [InReview, Posted, Closed] }
        result:
          description: "Set when stage is Posted: what GIS changed"
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LaisResult"
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [UPI_MISSING, NO_RESULT_PARCELS] }
              message: { type: string }
        updated_at: { type: [string, "null"], format: date-time, description: "When stage, result or warnings last changed" }
    LaisResult:
      type: object
      properties:
        parcels:
          type: array
          description: The parcels the transaction produced (Merge, Subdivision, CreatePlot) or corrected in place (CorrectBoundaries)
          items:
            type: object
            properties:
              UPI: { type: [string, "null"], description: "null until GIS assigns it (warning UPI_MISSING)" }
              current: { type: boolean, description: "false if GIS has retired this parcel since (a later merge or subdivision)" }
              area_sqm: { type: [number, "null"] }
              province: { type: [string, "null"] }
              district: { type: [string, "null"] }
              sector: { type: [string, "null"] }
              cell: { type: [string, "null"] }
              village: { type: [string, "null"] }
        retired_parcels:
          type: array
          description: The parcels the transaction ended. Their UPIs have expired.
          items: { type: object, properties: { UPI: { type: [string, "null"] } } }
        records:
          type: array
          description: The Parcel Fabric record(s) of the change
          items: { type: object, properties: { name: { type: [string, "null"] }, recorded_date: { type: [string, "null"], format: date-time } } }
        completed_at: { type: [string, "null"], format: date-time, description: "Latest GIS edit of these parcels" }
        detected_at: { type: string, format: date-time, description: "When this API first found the change in sde.DEFAULT" }
      example:
        parcels:
          - { UPI: "1/02/08/01/18372", current: true, area_sqm: 1570.96, province: null, district: null, sector: null, cell: null, village: null }
          - { UPI: "1/02/08/01/18373", current: true, area_sqm: 1570.96, province: null, district: null, sector: null, cell: null, village: null }
        retired_parcels: [{ UPI: "1/02/08/01/18371" }]
        records: [{ name: "SUBV-000008-20261120", recorded_date: "2026-11-20T00:00:00.000Z" }]
        completed_at: "2026-11-25T08:37:13.000Z"
        detected_at: "2026-11-26T08:07:26.559Z"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: Machine-readable code
              examples: [auth_required, invalid_token, forbidden, not_found, invalid_json, portal_unavailable, internal_error]
            message: { type: string, description: Message suitable for users }
            details: { description: Validation issues or other details, when available }
            requestId: { type: string }


    Health:
      type: object
      required: [status, time, arcgis]
      properties:
        status: { type: string, const: ok }
        time: { type: string, format: date-time }
        arcgis:
          type: object
          required: [reachable]
          properties:
            reachable: { type: boolean }
            version: { type: [string, number], description: ArcGIS Server version, when reachable }
            latencyMs: { type: integer, description: Round trip of the check, when reachable }

    RuntimeConfig:
      type: object
      required: [portalUrl, serverUrl, oauthAppId, services, project]
      properties:
        portalUrl: { type: string, format: uri }
        serverUrl: { type: string, format: uri }
        oauthAppId: { type: [string, "null"], description: Portal OAuth app ID when configured; otherwise the SDK sign-in dialog is used }
        services:
          type: object
          required: [mapServer, featureServer, parcelFabricServer, versionManagementServer, validationServer]
          properties:
            mapServer: { type: string, format: uri }
            featureServer: { type: string, format: uri }
            parcelFabricServer: { type: string, format: uri }
            versionManagementServer: { type: string, format: uri }
            validationServer: { type: string, format: uri }
        project:
          type: object
          properties:
            name: { type: string }
            dataset: { type: string }

    AppRole:
      type: string
      enum: [ADMINISTRATOR, GIS_EDITOR, SURVEYOR, VIEWER]

    Permission:
      type: string
      enum:
        - map:view
        - features:edit
        - attributes:edit
        - parcels:edit
        - parcels:construct
        - records:manage
        - versions:manage
        - versions:post
        - validation:run
        - analysis:run
        - data:export
        - data:import
        - admin:audit
        - admin:forms

    SessionUser:
      type: object
      required: [username, fullName, portalRole, privileges, appRole, permissions, canEditFeaturesInPortal]
      properties:
        username: { type: string, examples: [gisa@esri_rw] }
        fullName: { type: string }
        email: { type: string }
        portalRole: { type: string, examples: [org_admin, org_publisher, org_user] }
        userLicenseTypeId: { type: string, examples: [GISProfessionalAdvUT] }
        privileges:
          type: array
          items: { type: string }
        thumbnailUrl: { type: string, format: uri }
        appRole: { $ref: "#/components/schemas/AppRole" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        canEditFeaturesInPortal:
          type: boolean
          description: Portal grants feature editing. ArcGIS still enforces it on every edit.

    AuditEventInput:
      type: object
      required: [action, outcome]
      properties:
        action:
          type: string
          minLength: 3
          maxLength: 120
          pattern: "^[a-z0-9]+(?:[.-][a-z0-9]+)*$"
          examples: [feature.edit, version.reconcile, parcel-fabric.merge-parcels]
        outcome: { type: string, enum: [success, failure, attempt] }
        target: { type: string, maxLength: 500, description: What the action was on, e.g. a version name }
        details:
          type: object
          additionalProperties: true

    AuditEvent:
      allOf:
        - $ref: "#/components/schemas/AuditEventInput"
        - type: object
          required: [id, time, username, appRole]
          properties:
            id: { type: string, format: uuid }
            time: { type: string, format: date-time }
            username: { type: string }
            appRole: { type: string }
            ip: { type: string }
            requestId: { type: string }

    Bookmark:
      type: object
      description: An ArcGIS Maps SDK bookmark (JSON). Other properties are kept as sent.
      additionalProperties: true
      properties:
        name: { type: string, maxLength: 200 }
        extent: { type: object, additionalProperties: true }
        viewpoint: { type: object, additionalProperties: true }
        timeExtent: {}

    BookmarkList:
      type: object
      required: [bookmarks]
      properties:
        bookmarks:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Bookmark" }
